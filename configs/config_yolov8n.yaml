# =============================================================================
# YOLOv8 Nano Config - Durian Disease Detection (Object Detection)
# Fastest model, ideal for quick testing and real-time inference
# =============================================================================
# Model: YOLOv8n (nano) - 3.2M params, mAP(COCO)=37.4%
# GPU: RTX 4050 Laptop (6GB VRAM) - recommended batch=16
# =============================================================================

detection:
  model: yolov8n.pt
  data_yaml: data/detect_yolo/dataset.yaml
  project: results/detection
  experiment_name: yolov8n_disease

training:
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 50
  save_period: 10
  workers: 4
  device: 0

  # Optimizer
  optimizer: AdamW
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

  # Warmup
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Loss weights
  box: 7.5
  cls: 0.5
  dfl: 1.5

  amp: true

validation:
  conf: 0.001
  iou: 0.6
  split: val
  imgsz: 640

augmentation:
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.0
  degrees: 15.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  close_mosaic: 10

classes:
  nc: 5
  names:
    0: ALGAL_LEAF_SPOT
    1: ALLOCARIDARA_ATTACK
    2: HEALTHY_LEAF
    3: LEAF_BLIGHT
    4: PHOMOPSIS_LEAF_SPOT

inference:
  conf: 0.25
  iou: 0.45
  imgsz: 640
  max_det: 300
  augment: false
